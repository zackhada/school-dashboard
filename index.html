<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fall 2026 Dashboard</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:1000px;margin:0 auto;padding:16px;color:#222}
h1{font-size:20px;margin-bottom:4px}
h2{font-size:16px;margin-top:24px;margin-bottom:8px}
details{border:1px solid #ddd;border-radius:8px;margin:10px 0;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:15px}
.small{font-size:12px;color:#666}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;table-layout:fixed}
th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;overflow:hidden;text-overflow:ellipsis}
th{font-weight:600;color:#444;background:#fafafa}
col.c-class{width:14%}col.c-assn{width:26%}col.c-status{width:12%}col.c-days{width:12%}col.c-grade{width:10%}
col.c-note{width:45%}col.c-act{width:10%}
td.grade{color:#1a7f37;font-weight:600}
.cm{font-size:12px;color:#333}
tr:hover td{background:#f9f9f9}
.done{color:#1a7f37}
.todo{color:#b54708}
.blocked{color:#666}
.blocked_inperson{color:#666}
.bar{height:6px;background:#eee;border-radius:3px;margin:4px 0}
.bar>div{height:6px;background:#1a7f37;border-radius:3px}
a{color:#0066cc;text-decoration:none}
a:hover{text-decoration:underline}
.overdue{color:#c00;font-weight:600}
.health{margin:10px 0;padding:10px 12px;border-radius:8px;font-size:14px}
.health.ok{background:#e8f5e9;border:1px solid #9ccc65;color:#1b5e20}
.health.bad{background:#fff3e0;border:1px solid #ffb74d;color:#8a4b00}
.days-left{font-variant-numeric:tabular-nums}
tr.past td{color:#999}
tr.past td.days-left{color:#999;font-weight:400}
tr.today td.days-left{color:#c00;font-weight:700}
</style>
</head><body>
<h1>Fall 2026 Dashboard</h1>
<p class="small" id="ts">Loading...</p>
<div id="health"></div>
<div id="needs"></div>
<div id="audit"></div>
<div id="app"></div>
<script>
var REPOS = [
  ["HRM 391","hrm391-automation"],
  ["STRAT 392","strat392-automation"],
  ["REL C 333","rel-c-333-automation"],
  ["PSE 390","pse390-automation"],
  ["FIN 201","fin201-automation"],
  ["IS 515","is515-automation"],
  ["ECON 110","econ110-automation"]
];
var now = new Date(); now.setHours(0,0,0,0);
var in14 = new Date(now.getTime() + 14*864e5);
function parseD(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
// Canvas stores due_at in UTC. A 11:59pm Mountain deadline is written as
// 06:59:59Z THE NEXT DAY, so slicing the UTC date showed every such item a day
// late (IS 515 "Nov 5" that really closes Nov 4). Convert any ISO timestamp to
// its Mountain calendar date before it is displayed or counted down.
var MTN_FMT = new Intl.DateTimeFormat('en-CA', {timeZone:'America/Denver', year:'numeric', month:'2-digit', day:'2-digit'});
function mtnDay(s){
  var str = String(s||'');
  if (!/^\d{4}-\d{2}-\d{2}T/.test(str)) return parseD(str);
  var d = new Date(str);
  if (isNaN(d)) return parseD(str);
  var parts = MTN_FMT.formatToParts(d), y, m, day;
  parts.forEach(function(p){ if(p.type==='year')y=p.value; if(p.type==='month')m=p.value; if(p.type==='day')day=p.value; });
  return new Date(+y, +m-1, +day);
}
function fmtDay(d){
  if (!d) return '';
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
function esc(s){ return String(s||'').replace(/</g,'&lt;'); }
// Deadline for countdown/sort: Canvas due_at is truth when the row is matched
// to a Canvas item, else the ledger date. Prevents a stale ledger placeholder
// (e.g. HRM 391 Exam 1's 2026-12-01) from showing a false "48 days left".
function dueOf(x){
  if (x.grade && x.grade.due) { var cd = mtnDay(String(x.grade.due)); if (cd) return cd; }
  return parseD(x.date);
}
function daysLeft(d){ if(!d) return ''; return Math.ceil((d - now)/864e5); }
// Human wording for a deadline: "needs you, -4" made no sense.
function daysText(d){ if(!d) return ''; var n = daysLeft(d); return n < 0 ? (-n) + ' late' : (n === 0 ? 'today' : n); }
function dueWhen(d){ if(!d) return ''; var n = daysLeft(d); return n < 0 ? ' (' + (-n) + 'd overdue)' : (n === 0 ? ' (due today)' : ' (due in ' + n + 'd)'); }
function canvasUrl(course, canvasId){
  if (!course) return null;
  if (canvasId) return 'https://byu.instructure.com/courses/' + course + '/assignments/' + canvasId;
  return 'https://byu.instructure.com/courses/' + course;
}
function replyUrl(c, x, desc){
  return 'https://github.com/zackhada/school-dashboard/issues/new?title='+encodeURIComponent('[answer] '+c.repo+' '+x.key)+'&body='+encodeURIComponent(c.name+' \u2014 '+x.key+' (due '+(x.date||'n/a')+', '+x.status+')\n\nWhat is needed: '+desc+'\n\nMy answer:\n');
}
function titleFrom(key, note, course){
  var n = (note||'').replace(/^#\s*/,'').replace(/^Canvas\s+\d+,\s*[\d.]+\s*pts?,\s*/i,'')
            .replace(/\s*\[manual:[^\]]*\]/gi,'').replace(/\s*\([^()]*\)\s*$/,'').trim();
  if(/^\d+\.\d+/.test(n)) return n.split(',')[0].trim();
  if(/Topic\s+\d+/.test(n)) return n.split(',')[0].trim().replace(/^Topic\s+/,'Topic ');
  if(/Quiz\s+\d+/.test(n)) return n.split(',')[0].trim();
  if(/Exam\s+\d+/.test(n)) return n.split(',')[0].trim();
  if(/Assessment/.test(n)) return n.split(',')[0].trim();
  if(/Questionnaire/.test(n)) return 'Student Questionnaire';
  if(/Orientation/.test(n)) return 'Orientation Check';
  if(/Interview/.test(n)) return 'Professional Perspective Interview';
  if(/Choose.*Org/.test(n)) return 'Choose Default Organization';
  var pm = /PARTICIPATION_QUIZ_([A-Z]{3})(\d{1,2})/.exec(key);
  if (pm) return 'Participation Quiz ' + pm[1].charAt(0) + pm[1].slice(1).toLowerCase() + ' ' + pm[2];
  if(/MEET_TA/.test(key)) return 'Meet TA';
  return key.replace(/_/g,' ').replace(/\b(\w)(\w*)\b/g,function(_,a,b){return a.toUpperCase()+b.toLowerCase();});
}
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
// Optional extra credit (Zack 2026-10-25). The course calls these optional, so
// they are tracked in the data but never rendered as work Zack owes. Kept in
// sync with OPTIONAL_EC / OPTIONAL_KEY in scripts/build.py.
function isOptionalEc(x){
  if (!x) return false;
  if (x.optional_ec) return true;
  if (/(^|_)TA_PASSOFF(_|$)/i.test(x.key || '')) return true;
  return /\[optional-ec/i.test(x.note || '');
}
function statusOf(x){
  if (x.status === 'done') return ['done', 'done'];
  if (x.status && x.status.indexOf('blocked') === 0) {
    // What the human sees is decided by the LLM surface judge, with the
    // evidence gate as fallback (see scripts/build.py). A blocked row with no
    // judge verdict and no evidence is "agent checking", never an action item.
    if (x.judge && x.judge.verdict === 'manual') return ['in person', 'blocked'];
    if (x.judge && x.judge.verdict === 'verify') return ['verify', 'blocked'];
    if (x.judge && x.judge.verdict === 'automatable') return ['automated', 'todo'];
    if (x.surface) return ['in person', 'blocked'];
    return ['agent checking', 'todo'];
  }
  return ['automated', 'todo'];
}
function words(s){ return norm(s).split(' ').filter(function(w){ return w.length > 2 && ['cengage','mindtap','class','pre','post'].indexOf(w) < 0; }); }
function tokMatch(a,b){ if(a===b) return true; return a.length>=4 && b.length>=4 && (a.indexOf(b)===0 || b.indexOf(a)===0); }
function overlapCount(tw,gw){ return tw.filter(function(a){ return gw.some(function(b){ return tokMatch(a,b); }); }).length; }
function matchGrade(title, dueDay, grows){
  var tw = words(title), best = null, bestScore = -1;
  grows.forEach(function(g){
    var gday = g.due ? String(g.due).slice(0,10) : '';
    var overlap = overlapCount(tw, words(g.name));
    // Learning Suite / MyEducator rows have no canvas_id; require a real name
    // overlap so a shared due date cannot pair the wrong item.
    if (overlap === 0 && g.canvas_id == null) return;
    // Ledger dates are Mountain-local while Canvas due_at is UTC, so the
    // same deadline can be one calendar day apart. Exact day wins, +/-1 allowed.
    var dayBonus = 0;
    if (gday && dueDay) {
      var d1 = parseD(gday), d2 = parseD(dueDay);
      if (d1 && d2) {
        var diff = Math.abs((d1 - d2)/864e5);
        if (diff === 0) dayBonus = 100; else if (diff <= 1) dayBonus = 60;
      }
    }
    var score = overlap * 10 + dayBonus;
    if (score > bestScore) { bestScore = score; best = g; }
  });
  if (!best || bestScore <= 0) return null;
  return best;
}
function gradeCell(g){
  if (!g) return '<span class="small">—</span>';
  if (g.score != null) return esc(g.score) + ' / ' + esc(g.points);
  var miss = g.missing || (g.status === 'unsubmitted' && g.due && new Date(g.due) < new Date());
  if (miss) return '0 / ' + esc(g.points);
  return '<span class="small">—</span>';
}
function commentsCell(g){
  if (!g || !g.comments || !g.comments.length) return '<span class="small">—</span>';
  return g.comments.map(function(m){ return '<div class="cm">' + esc(m.comment||'') + ' <span class="small">— ' + esc(m.author||'grader') + '</span></div>'; }).join('');
}
Promise.all(REPOS.map(function(pair){
  return fetch('data/' + pair[1] + '.combined.json').then(function(r){
    if (!r.ok) throw new Error('no combined');
    return r.json();
  }).then(function(c){
    return {name: pair[0], repo: pair[1],
      rows: (c.rows || []).filter(function(x){ return !x.drift; }).map(function(x){
        return {key: x.key, status: x.status, date: x.date, note: x.note, grade: x.grade || null, needs: !!x.needs_zack, judge: x.judge || null, surface: !!x.surface, optional_ec: isOptionalEc(x), actionable: (x.actionable === undefined ? !!x.surface : !!x.actionable)};
      }),
      course: c.course_id || null,
      needs: c.needs || null,
      needs_unassigned: !!c.needs_unassigned,
      grows: (c.rows || []).map(function(x){ return x.grade; }).filter(Boolean),
      overall: c.overall || null,
      drift: c.unmatched_canvas || []};
  }).catch(function(){
    var led = fetch('data/' + pair[1] + '.json').then(function(r){ return r.ok ? r.json() : {rows:[]}; }).catch(function(){ return {rows:[]}; });
    var grd = fetch('data/' + pair[1] + '.grades.json').then(function(r){ return r.ok ? r.json() : {rows:[]}; }).catch(function(){ return {rows:[]}; });
    return Promise.all([led, grd]).then(function(p){ return {name: pair[0], repo: pair[1], rows: p[0].rows || [], grows: p[1].rows || [], overall: (p[1] && p[1].overall) || null, drift: []}; });
  });
})).then(function(classes){
  var html = '', queue = [];
  classes.forEach(function(c){
    var items = [];
    c.rows.forEach(function(x){
      if (x.key.indexOf('SETUP') === 0 || x.key.indexOf('RECON') >= 0) return;
      if (isOptionalEc(x)) return;
      if (/\b0\s?pts?\b/i.test(x.note || '')) return;
      var d = dueOf(x);
      if (!d) return;
      items.push({x: x, d: d});
    });
    items.sort(function(a,b){ return a.d - b.d; });
    var done = items.filter(function(a){ return a.x.status === 'done'; }).length;
    var ov = (c.overall && c.overall.current_score != null) ? ' \u00b7 ' + Math.round(c.overall.current_score) + '%' : '';
    html += '<details open><summary>' + esc(c.name) + ' (' + done + '/' + items.length + ')' + ov + '</summary>';
    if (!items.length) { html += '<p class="small">No assignments.</p></details>'; return; }
    html += '<table><colgroup><col class="c-assn"><col class="c-status"><col class="c-days"><col class="c-grade"><col></colgroup><thead><tr><th>Assignment</th><th>Status</th><th>Days</th><th>Grade</th><th>Comments</th></tr></thead><tbody>';
    items.forEach(function(a){
      var x = a.x;
      var st = statusOf(x), cls = st[1];
      var n = daysLeft(a.d);
      var rowCls = n < 0 ? 'past' : (n === 0 ? 'today' : '');
      var title = titleFrom(x.key, x.note, c.name);
      var g = x.grade || matchGrade(title + ' ' + x.key, x.date, c.grows);
      // The queue is what the runner still has to do. It is the answer to
      // "what is next", which the manual lists alone never answered.
      if (x.status === 'pending' && a.d >= now) {
        queue.push({d: a.d, cls: c.name, title: title});
      }
      html += '<tr class="'+rowCls+'"><td class="'+cls+'">'+esc(title)+'</td><td class="'+cls+'">'+st[0]+'</td><td class="days-left">'+n+'</td><td class="grade">'+gradeCell(g)+'</td><td>'+commentsCell(g)+'</td></tr>';
    });
    html += '</tbody></table></details>';
  });
  // Consolidated next-up list: the nearest work across every class, whether the
  // agent does it or Zack has to.
  queue.sort(function(a,b){ return a.d - b.d; });
  if (queue.length) {
    var qrows = queue.slice(0, 10).map(function(q){
      return '<tr><td class="days-left">' + daysLeft(q.d) + '</td><td>' + esc(q.cls) +
             '</td><td>' + esc(q.title) + '</td><td class="small">automation</td></tr>';
    }).join('');
    html = '<h2>Next up (everything, soonest first)</h2>' +
      '<p class="small">The next 10 items the runner still has to complete, plus anything on your lists below. ' +
      'One per day, inside the realistic window (1 to 3 days before due).</p>' +
      '<table><colgroup><col class="c-days"><col class="c-assn"><col class="c-assn"><col></colgroup>' +
      '<thead><tr><th>Days</th><th>Class</th><th>Assignment</th><th>Who</th></tr></thead><tbody>' +
      qrows + '</tbody></table>' + html;
  }
  document.getElementById('app').innerHTML = html;
  var need = '', inperson = [], unchecked = 0;
  classes.forEach(function(c){
    c.rows.forEach(function(x){
      if (isOptionalEc(x)) return;
      var isBlocked = x.status && x.status.indexOf('blocked') === 0;
      // A blocked row only reaches a human action list when the judge (or the
      // evidence gate, if the judge has not run) says a human is really
      // required. Everything else is work the runner can still do.
      var surfaced = !!x.surface || (x.judge && (x.judge.verdict === 'manual' || x.judge.verdict === 'verify')) || x.status === 'blocked_ask_zack';
      var actionable = (x.actionable !== undefined) ? !!x.actionable : surfaced;
      if (isBlocked && !surfaced && !x.needs) { if (x.status !== 'done') unchecked++; return; }
      var waitsOnYou = (isBlocked && surfaced) || (x.needs && x.status !== 'done');
      if (!waitsOnYou) return;
      var d = dueOf(x);
      var rowNote = (x.note || '').replace(/^#\s*/,'');
      // A parked needs_user note belongs on the row it names. In-person rows
      // always keep their own concrete note (the code/room/proctor detail);
      // only a needs row borrows the matched excerpt instead of the whole dump.
      var parkedNote = (!isBlocked && x.needs)
        ? (x.needs_excerpt || c.needs || rowNote)
        : rowNote;
      var note = esc(parkedNote);
      // A blocked job that is not physically yours (a team project, a
      // decision) belongs in "Needs your input", not under "In person +
      // proctored". Only real room/proctor/attendance evidence keeps it there.
      var physText = ((x.note || '') + ' ' + ((x.judge && x.judge.why) || ''))
        .replace(/no[- ]proctor\w*|not[- ]proctor\w*|without[- ]proctor\w*/ig, '');
      var physical = /proctor|in person|in-person|testing center|lockdown|attendance|bring to class|on paper|physical presence/i
        .test(physText);
      if (isBlocked && surfaced && (physical || x.status === 'blocked_inperson')) {
        if (/\b0\s?pts?\b/i.test(x.note || '')) return;
        // Skip phantom rows for Canvas items deleted upstream (e.g. pse390
        // PARTICIPATION_QUIZ_10_13_2, "404 deleted upstream"); they are not
        // real upcoming deadlines and must never surface here.
        if (/\b(404|deleted|removed upstream|no longer)\b/i.test(x.note || '')) return;
        // Future items only. A past item is either done or already missed, and
        // attendance is not a task at all, so neither is an action item. Show
        // ALL upcoming in-person/proctored items (no forward cap) so a
        // further-out exam can never hide; sort soonest-first below.
        // A decision row (blocked_ask_zack, e.g. "ask the professor for a
        // makeup") does not expire with its date, so it stays visible. Plain
        // manual work must still be upcoming.
        if (d && actionable && (d >= now || x.status === 'blocked_ask_zack')) {
          var curl = canvasUrl(c.course, x.grade && x.grade.canvas_id);
          var cell = curl ? '<a href="'+curl+'">Canvas</a>' : '';
          var rurl = replyUrl(c, x, note);
          inperson.push({d: d, html: '<tr><td><b>'+c.name+' \u2014 '+esc(titleFrom(x.key, x.note, c.name))+'</b></td><td class="days-left">'+daysText(d)+'</td><td class="small">'+note+'</td><td>'+cell+'</td><td><a href="'+rurl+'">Reply</a></td></tr>'});
        }
        return;
      }
      if (d && d < now && !x.needs) return;
      var title = titleFrom(x.key, x.note, c.name);
      var stLabel = x.status === 'missed' ? 'missed' : 'needs you';
      var when = (x.status === 'missed')
        ? (daysLeft(d) < 0 ? ' (' + (-daysLeft(d)) + 'd ago)' : '')
        : dueWhen(d);
      var curl2 = canvasUrl(c.course, x.grade && x.grade.canvas_id);
      var canvasCell = curl2 ? ' <a href="'+curl2+'">Canvas</a>' : '';
      need += '<tr><td><b>'+c.name+' \u2014 '+esc(title)+'</b></td><td class="'+esc(x.status)+'">'+esc(stLabel)+when+'</td><td class="small">'+note+canvasCell+'</td><td><a href="'+replyUrl(c, x, parkedNote)+'">Reply</a></td></tr>';
    });
    // A parked note that names no single assignment belongs to the whole
    // class (a lockout, an outage, a roster question). Showing it here keeps
    // it visible without pretending it is about one quiz.
    if (c.needs_unassigned && (c.needs || '').trim()) {
      var cnote = esc((c.needs || '').replace(/^#\s*/, '').slice(0, 900));
      need += '<tr><td><b>'+c.name+' \u2014 class-wide note</b></td><td class="blocked_ask_zack">status</td><td class="small">'+cnote+'</td><td><a href="'+replyUrl(c, {key:'CLASS_NOTE', note:c.needs}, c.needs)+'">Reply</a></td></tr>';
    }
  });
  if (need) {
    document.getElementById('needs').innerHTML = '<h2>Needs your input</h2><p class="small">Items waiting on your decision or your own action. Reply and the runner continues.</p><table><colgroup><col class="c-assn"><col class="c-status"><col class="c-note"><col class="c-act"></colgroup><thead><tr><th>Assignment</th><th>Status</th><th>Note</th><th>Action</th></tr></thead><tbody>'+need+'</tbody></table>';
  } else {
    document.getElementById('needs').innerHTML = '<h2>Needs your input</h2><p class="small">Nothing waiting on you.</p>';
  }
  if (inperson.length) {
    inperson.sort(function(a,b){ return a.d - b.d; });
    var ipRows = inperson.map(function(r){ return r.html; }).join('');
    document.getElementById('needs').innerHTML += '<h2>In person + proctored (soonest first)</h2><table><colgroup><col class="c-assn"><col class="c-days"><col class="c-note"></colgroup><thead><tr><th>Assignment</th><th>Days Left</th><th>Details</th><th>Canvas</th><th>Action</th></tr></thead><tbody>'+ipRows+'</tbody></table>';
  }
  if (unchecked) {
    document.getElementById('needs').innerHTML += '<p class="small">' + unchecked + ' item(s) are marked manual but have no verified reason yet. The agent re-judges them every night and they stay off your list until that judgment lands.</p>';
  }
  var drift = '';
  classes.forEach(function(c){
    (c.drift || []).forEach(function(g){
      drift += '<tr><td><b>' + c.name + ' — ' + esc(g.name) + '</b></td><td>' + esc(g.due ? String(g.due).slice(0,10) : 'n/a') + '</td><td>' + esc(g.score != null ? g.score : '—') + ' / ' + esc(g.points) + '</td></tr>';
    });
  });
  if (drift) {
    document.getElementById('needs').innerHTML += '<h2>Missing from ledger (' + classes.reduce(function(n,c){ return n + (c.drift||[]).length; }, 0) + ')</h2><p class="small">In Canvas but with no runner ledger row. Add them or they will never get done.</p><table><thead><tr><th>Assignment</th><th>Due</th><th>Grade</th></tr></thead><tbody>' + drift + '</tbody></table>';
  }
  // Closing soon: pulled from the daily assignment audit (Canvas truth, not the
  // ledger). This is the net that would have caught the HRM 391 Unit 1 Mid-term
  // Checkpoints BEFORE they locked on 2026-10-07 instead of 27 days after. An
  // item can have a ledger row, be parked as manual, or even read "done" in the
  // ledger and still be unsubmitted in Canvas. Anything worth points with a real
  // deadline inside three days shows here until Canvas says it is submitted.
  fetch('data/audit.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(a){
    if (!a) return;
    // Exams first: these are the dates that cannot be recovered if they slip.
    // Windows come from the live Testing Center read, or from the verified
    // registry when that read is unavailable (audit.exam_windows_source).
    var exams = (a.exam_windows || []).concat(a.missed || []);
    if (exams.length) {
      // Sort by real time, not alphabetically: "Dec 09" sorts before "Nov 04"
      // as a string, which put the furthest exam first (2026-11-04).
      exams.sort(function(p, q){
        var A = Date.parse(p.closes || '') || 0, B = Date.parse(q.closes || '') || 0;
        return A - B;
      });
      var erows = exams.map(function(x){
        var missed = (a.missed || []).indexOf(x) >= 0;
        return '<tr><td><b>' + esc(x.course) + ' \u2014 ' + esc(x.test) + '</b></td>' +
               '<td class="small">' + esc(x.opens || 'n/a') + '</td>' +
               '<td class="small">' + esc(x.closes || 'n/a') + '</td>' +
               '<td class="' + (missed ? 'overdue' : 'days-left') + '">' +
               (missed ? 'MISSED, no score' : 'not taken yet') + '</td></tr>';
      }).join('');
      document.getElementById('audit').innerHTML +=
        '<h2>Exams and proctored windows (' + exams.length + ')</h2>' +
        '<p class="small">Source: ' + esc(a.exam_windows_source || 'testing center') +
        '. Proctored exams are yours to sit, never automated.</p>' +
        '<table><thead><tr><th>Exam</th><th>Opens</th><th>Closes</th><th>Status</th></tr></thead><tbody>' +
        erows + '</tbody></table>';
    }
    var all = [];
    (a.closing_soon || []).forEach(function(x){
      all.push({cls: x.course, title: x.assignment, d: x.due, when: mtnDay(x.due),
                kind: x.deadline_kind || 'due', pts: x.points,
                st: (x.owner === 'zack' ? 'you have to do this one \u00b7 ' : '') +
                    (x.ledger_status ? ('ledger ' + x.ledger_status) : 'no ledger row')});
    });
    (a.missing_from_ledger || []).forEach(function(x){
      all.push({cls: x.course, title: x.assignment, d: x.due, when: mtnDay(x.due),
                kind: x.deadline_kind || 'due', pts: x.points,
                st: 'NO LEDGER ROW, will never be picked up'});
    });
    if (!all.length) return;
    all.sort(function(p, q){ return String(p.d).localeCompare(String(q.d)); });
    var body = all.map(function(x){
      return '<tr><td><b>' + esc(x.cls) + ' \u2014 ' + esc(x.title) + '</b></td>' +
             '<td class="days-left">' + esc(fmtDay(x.when) || String(x.d)) + '</td>' +
             '<td class="small">' + esc(x.kind) + ' ' + esc(String(x.pts)) + 'pt \u00b7 ' +
             esc(x.st) + '</td></tr>';
    }).join('');
    document.getElementById('audit').innerHTML +=
      '<h2>Closing soon, still unsubmitted (' + all.length + ')</h2>' +
      '<p class="small">Read from Canvas directly, not from the ledger. If an item sits here more than a day, the runner is stuck on it.</p>' +
      '<table><thead><tr><th>Assignment</th><th>Closes</th><th>Status</th></tr></thead><tbody>' +
      body + '</tbody></table>';
  }).catch(function(){});


  // Health banner (2026-11-04). "Everything looks fine" was the failure mode:
  // the runner fleet was dark for a day and a half while this page rendered
  // normally, because only the coursework data was shown, never whether the
  // thing doing the work was alive.
  fetch('data/health.json').then(function(r){ return r.ok ? r.json() : null; }).then(function(h){
    if (!h) return;
    var hb = h.heartbeat || {};
    var age = (hb.age_hours === undefined || hb.age_hours === null) ? null : hb.age_hours;
    var asleep = (age !== null && age > 1);
    var offline = (h.offline_repos || []).length;
    var unverified = (h.runners_online === null || h.runners_online === undefined)
                     && (h.unverified_repos || []).length;
    var ok = h.healthy && !offline && !asleep;
    var bits = [];
    bits.push(unverified ? 'runner status could not be read (token)'
                         : (h.runners_online || 0) + ' of ' + (h.runners_checked || 0) + ' runners online');
    if (offline) bits.push(offline + ' repos with no online runner');
    if (asleep) bits.push('spare Mac silent for ' + Math.round(age) + ' hours');
    if (hb.free_gb) bits.push('free disk ' + hb.free_gb + ' GB');
    if (hb.bridge === false) bits.push('SMS bridge down');
    var stale = (h.stale_repos || []);
    var msg = ok ? 'Automation healthy'
                 : (asleep ? 'Waiting for the spare Mac to wake' : 'Automation needs a look');
    var html = '<div class="health ' + (ok ? 'ok' : 'bad') + '"><b>' + esc(msg) + '</b> ' +
               esc(bits.join(' \u00b7 ')) + '</div>';
    if (!ok && asleep) {
      // The Mac sleeping is normal, not an incident: it wakes on its own and
      // the queued runs drain then, staggered by repo so Duo is not stampeded.
      html += '<p class="small">Expected, nothing to do. ' +
              (h.queued_runs ? h.queued_runs + ' run(s) are queued and start when it wakes, ' +
                               'about 45 seconds apart per class (0s ECON to 270s STRAT). ' : '') +
              'This page and its dates still refresh from GitHub every 12 hours, ' +
              'so the list below is current even while the Mac sleeps.</p>';
    } else if (!ok && !unverified) {
      html += '<p class="small">Something is not where it should be. Check the watchdog issue in school-healer.</p>';
    }
    if (stale.length) {
      html += '<p class="small">Most stale: ' + stale.slice(0,3).map(function(x){
        return esc(x.repo.replace('-automation','')) + ' (' + (x.last_success_hours === null ? 'never' : Math.round(x.last_success_hours) + 'h') + ')';
      }).join(', ') + '</p>';
    }
    document.getElementById('health').innerHTML = html;
  }).catch(function(){});

  document.getElementById('ts').textContent = 'Updated ' + new Date().toUTCString();
});
</script>
</body></html>
