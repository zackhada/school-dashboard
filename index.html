<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fall 2026 Dashboard</title>
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:1000px;margin:0 auto;padding:16px;color:#222}
h1{font-size:20px;margin-bottom:4px}
h2{font-size:16px;margin-top:24px;margin-bottom:8px}
details{border:1px solid #ddd;border-radius:8px;margin:10px 0;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:15px}
.small{font-size:12px;color:#666}
table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px;table-layout:fixed}
th,td{padding:8px 10px;border-bottom:1px solid #eee;text-align:left;overflow:hidden;text-overflow:ellipsis}
th{font-weight:600;color:#444;background:#fafafa}
col.c-class{width:14%}col.c-assn{width:26%}col.c-status{width:12%}col.c-days{width:12%}col.c-grade{width:10%}
col.c-note{width:45%}col.c-act{width:10%}
td.grade{color:#1a7f37;font-weight:600}
.cm{font-size:12px;color:#333}
tr:hover td{background:#f9f9f9}
.done{color:#1a7f37}
.todo{color:#b54708}
.blocked{color:#666}
.blocked_inperson{color:#666}
.bar{height:6px;background:#eee;border-radius:3px;margin:4px 0}
.bar>div{height:6px;background:#1a7f37;border-radius:3px}
a{color:#0066cc;text-decoration:none}
a:hover{text-decoration:underline}
.overdue{color:#c00;font-weight:600}
.days-left{font-variant-numeric:tabular-nums}
tr.past td{color:#999}
tr.past td.days-left{color:#999;font-weight:400}
tr.today td.days-left{color:#c00;font-weight:700}
</style>
</head><body>
<h1>Fall 2026 Dashboard</h1>
<p class="small" id="ts">Loading...</p>
<div id="needs"></div>
<div id="app"></div>
<script>
var REPOS = [
  ["HRM 391","hrm391-automation"],
  ["STRAT 392","strat392-automation"],
  ["REL C 333","rel-c-333-automation"],
  ["PSE 390","pse390-automation"],
  ["FIN 201","fin201-automation"],
  ["IS 515","is515-automation"],
  ["ECON 110","econ110-automation"]
];
var now = new Date(); now.setHours(0,0,0,0);
var in7 = new Date(now.getTime() + 7*864e5);
function parseD(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function esc(s){ return String(s||'').replace(/</g,'&lt;'); }
function daysLeft(d){ if(!d) return ''; return Math.ceil((d - now)/864e5); }
function titleFrom(key, note, course){
  var n = (note||'').replace(/^#\s*/,'');
  if(/^\d+\.\d+/.test(n)) return n.split(',')[0].trim();
  if(/Topic\s+\d+/.test(n)) return n.split(',')[0].trim().replace(/^Topic\s+/,'Topic ');
  if(/Quiz\s+\d+/.test(n)) return n.split(',')[0].trim();
  if(/Exam\s+\d+/.test(n)) return n.split(',')[0].trim();
  if(/Assessment/.test(n)) return n.split(',')[0].trim();
  if(/Questionnaire/.test(n)) return 'Student Questionnaire';
  if(/Orientation/.test(n)) return 'Orientation Check';
  if(/Interview/.test(n)) return 'Professional Perspective Interview';
  if(/Choose.*Org/.test(n)) return 'Choose Default Organization';
  var pm = /PARTICIPATION_QUIZ_([A-Z]{3})(\d{1,2})/.exec(key);
  if (pm) return 'Participation Quiz ' + pm[1].charAt(0) + pm[1].slice(1).toLowerCase() + ' ' + pm[2];
  if(/MEET_TA/.test(key)) return 'Meet TA';
  return key.replace(/_/g,' ').replace(/\b(\w)(\w*)\b/g,function(_,a,b){return a.toUpperCase()+b.toLowerCase();});
}
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function statusOf(x){
  if (x.status === 'done') return ['done', 'done'];
  if (x.status === 'blocked_inperson') return ['in person', 'blocked'];
  return ['automated', 'todo'];
}
function words(s){ return norm(s).split(' ').filter(function(w){ return w.length > 2; }); }
function tokMatch(a,b){ if(a===b) return true; return a.length>=4 && b.length>=4 && (a.indexOf(b)===0 || b.indexOf(a)===0); }
function overlapCount(tw,gw){ return tw.filter(function(a){ return gw.some(function(b){ return tokMatch(a,b); }); }).length; }
function matchGrade(title, dueDay, grows){
  var tw = words(title), best = null, bestScore = -1;
  grows.forEach(function(g){
    var gday = g.due ? String(g.due).slice(0,10) : '';
    var overlap = overlapCount(tw, words(g.name));
    // Ledger dates are Mountain-local while Canvas due_at is UTC, so the
    // same deadline can be one calendar day apart. Exact day wins, +/-1 allowed.
    var dayBonus = 0;
    if (gday && dueDay) {
      var d1 = parseD(gday), d2 = parseD(dueDay);
      if (d1 && d2) {
        var diff = Math.abs((d1 - d2)/864e5);
        if (diff === 0) dayBonus = 100; else if (diff <= 1) dayBonus = 60;
      }
    }
    var score = overlap * 10 + dayBonus;
    if (score > bestScore) { bestScore = score; best = g; }
  });
  if (!best || bestScore <= 0) return null;
  return best;
}
function gradeCell(g){
  if (!g) return '<span class="small">—</span>';
  if (g.score != null) return esc(g.score) + ' / ' + esc(g.points);
  var miss = g.missing || (g.status === 'unsubmitted' && g.due && new Date(g.due) < new Date());
  if (miss) return '0 / ' + esc(g.points);
  return '<span class="small">—</span>';
}
function commentsCell(g){
  if (!g || !g.comments || !g.comments.length) return '<span class="small">—</span>';
  return g.comments.map(function(m){ return '<div class="cm">' + esc(m.comment||'') + ' <span class="small">— ' + esc(m.author||'grader') + '</span></div>'; }).join('');
}
Promise.all(REPOS.map(function(pair){
  return fetch('data/' + pair[1] + '.combined.json').then(function(r){
    if (!r.ok) throw new Error('no combined');
    return r.json();
  }).then(function(c){
    return {name: pair[0], repo: pair[1],
      rows: (c.rows || []).filter(function(x){ return !x.drift; }).map(function(x){
        return {key: x.key, status: x.status, date: x.date, note: x.note};
      }),
      grows: (c.rows || []).map(function(x){ return x.grade; }).filter(Boolean),
      drift: c.unmatched_canvas || []};
  }).catch(function(){
    var led = fetch('data/' + pair[1] + '.json').then(function(r){ return r.ok ? r.json() : {rows:[]}; }).catch(function(){ return {rows:[]}; });
    var grd = fetch('data/' + pair[1] + '.grades.json').then(function(r){ return r.ok ? r.json() : {rows:[]}; }).catch(function(){ return {rows:[]}; });
    return Promise.all([led, grd]).then(function(p){ return {name: pair[0], repo: pair[1], rows: p[0].rows || [], grows: p[1].rows || [], drift: []}; });
  });
})).then(function(classes){
  var html = '';
  classes.forEach(function(c){
    var items = [];
    c.rows.forEach(function(x){
      if (x.key.indexOf('SETUP') === 0 || x.key.indexOf('RECON') >= 0) return;
      if (/\b0\s?pts?\b/i.test(x.note || '')) return;
      var d = parseD(x.date);
      if (!d) return;
      items.push({x: x, d: d});
    });
    items.sort(function(a,b){ return a.d - b.d; });
    var done = items.filter(function(a){ return a.x.status === 'done'; }).length;
    html += '<details open><summary>' + esc(c.name) + ' (' + done + '/' + items.length + ')</summary>';
    if (!items.length) { html += '<p class="small">No assignments.</p></details>'; return; }
    html += '<table><colgroup><col class="c-assn"><col class="c-status"><col class="c-days"><col class="c-grade"><col></colgroup><thead><tr><th>Assignment</th><th>Status</th><th>Days</th><th>Grade</th><th>Comments</th></tr></thead><tbody>';
    items.forEach(function(a){
      var x = a.x;
      var st = statusOf(x), cls = st[1];
      var n = daysLeft(a.d);
      var rowCls = n < 0 ? 'past' : (n === 0 ? 'today' : '');
      var title = titleFrom(x.key, x.note, c.name);
      var g = matchGrade(title, x.date, c.grows);
      html += '<tr class="'+rowCls+'"><td class="'+cls+'">'+esc(title)+'</td><td class="'+cls+'">'+st[0]+'</td><td class="days-left">'+n+'</td><td class="grade">'+gradeCell(g)+'</td><td>'+commentsCell(g)+'</td></tr>';
    });
    html += '</tbody></table></details>';
  });
  document.getElementById('app').innerHTML = html;
  var need = '', inperson = '';
  classes.forEach(function(c){
    c.rows.forEach(function(x){
      var isBlocked = x.status && x.status.indexOf('blocked') === 0;
      if (!isBlocked) return;
      var d = parseD(x.date);
      var note = esc((x.note||'').replace(/^#\s*/,''));
      if (x.status === 'blocked_inperson') {
        if (/\b0\s?pts?\b/i.test(x.note || '')) return;
        if (d && d >= now && d <= in7) inperson += '<tr><td><b>'+c.name+' \u2014 '+esc(titleFrom(x.key, x.note, c.name))+'</b></td><td>'+daysLeft(d)+'</td><td class="small">'+note+'</td></tr>';
        return;
      }
      if (d && d < now) return;
      var title = titleFrom(x.key, x.note, c.name);
      need += '<tr><td><b>'+c.name+' \u2014 '+esc(title)+'</b></td><td class="'+esc(x.status)+'">'+esc(x.status)+(x.date?', '+daysLeft(d):'')+'</td><td class="small">'+note+'</td><td><a href="https://github.com/zackhada/school-dashboard/issues/new?title='+encodeURIComponent('[answer] '+c.repo+' '+x.key)+'&body='+encodeURIComponent(c.name+' \u2014 '+x.key+' (due '+(x.date||'n/a')+', '+x.status+')\n\nContext: '+(x.note||'none')+'\n\nMy answer:\n')+'">Reply</a></td></tr>';
    });
  });
  if (need) {
    document.getElementById('needs').innerHTML = '<h2>Needs your input</h2><p class="small">Automatable tasks stuck on your input. Reply and the runner continues.</p><table><colgroup><col class="c-assn"><col class="c-status"><col class="c-note"><col class="c-act"></colgroup><thead><tr><th>Assignment</th><th>Status</th><th>Note</th><th>Action</th></tr></thead><tbody>'+need+'</tbody></table>';
  } else {
    document.getElementById('needs').innerHTML = '<h2>Needs your input</h2><p class="small">Nothing waiting on you.</p>';
  }
  if (inperson) {
    document.getElementById('needs').innerHTML += '<h2>In person + proctored (7 days)</h2><table><colgroup><col class="c-assn"><col class="c-days"><col class="c-note"></colgroup><thead><tr><th>Assignment</th><th>Days Left</th><th>Details</th></tr></thead><tbody>'+inperson+'</tbody></table>';
  }
  var drift = '';
  classes.forEach(function(c){
    (c.drift || []).forEach(function(g){
      drift += '<tr><td><b>' + c.name + ' — ' + esc(g.name) + '</b></td><td>' + esc(g.due ? String(g.due).slice(0,10) : 'n/a') + '</td><td>' + esc(g.score != null ? g.score : '—') + ' / ' + esc(g.points) + '</td></tr>';
    });
  });
  if (drift) {
    document.getElementById('needs').innerHTML += '<h2>Missing from ledger (' + classes.reduce(function(n,c){ return n + (c.drift||[]).length; }, 0) + ')</h2><p class="small">In Canvas but with no runner ledger row. Add them or they will never get done.</p><table><thead><tr><th>Assignment</th><th>Due</th><th>Grade</th></tr></thead><tbody>' + drift + '</tbody></table>';
  }
  document.getElementById('ts').textContent = 'Updated ' + new Date().toUTCString();
});
</script>
</body></html>
