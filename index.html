<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fall 2026 Dashboard</title>
<style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:720px;margin:0 auto;padding:16px;color:#222}
h1{font-size:20px}.small{font-size:12px;color:#666}
details{border:1px solid #ddd;border-radius:8px;margin:10px 0;padding:10px 12px}
summary{font-size:16px;cursor:pointer;font-weight:600}
ul{font-size:14px;padding-left:20px}.done{color:#1a7f37}.todo{color:#b54708}.blocked{color:#666}
.bar{height:8px;background:#eee;border-radius:4px;margin:6px 0}.bar>div{height:8px;background:#1a7f37;border-radius:4px}</style>
</head><body>
<h1>Fall 2026 Dashboard</h1>
<p class="small" id="ts">Loading...</p>
<div id="needs"></div>
<div id="app"></div>
<script>
var REPOS = [
  ["HRM 391","hrm391-automation"],
  ["STRAT 392","strat392-automation"],
  ["REL C 333","rel-c-333-automation"],
  ["PSE 390","pse390-automation"],
  ["FIN 201","fin201-automation"],
  ["IS 515","is515-automation"],
  ["ECON 110","econ110-automation"]
];
var now = new Date(); now.setHours(0,0,0,0);
var in7 = new Date(now.getTime() + 7*864e5);
function parseD(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function esc(s){ return String(s||'').replace(/</g,'&lt;'); }
Promise.all(REPOS.map(function(pair){
  return fetch('data/' + pair[1] + '.json').then(function(r){ return r.ok ? r.json() : {rows:[]}; }).catch(function(){ return {rows:[]}; }).then(function(d){ return {name: pair[0], repo: pair[1], rows: d.rows || []}; });
})).then(function(classes){
  var html = '';
  classes.forEach(function(c){
    var up = c.rows.filter(function(x){
      if (x.key.indexOf('SETUP') === 0) return false;
      if (x.status === 'blocked_inperson') return false;
      if (/\b0\s?pts?\b/i.test(x.note || '')) return false;
      var d = parseD(x.date);
      return d && d >= now && d <= in7;
    });
    var done = up.filter(function(x){ return x.status === 'done'; }).length;
    var pct = up.length ? Math.round(100*done/up.length) : 100;
    var open = up.some(function(x){ return x.status === 'pending'; }) ? ' open' : '';
    html += '<details' + open + '><summary>' + c.name + ' (' + done + '/' + up.length + ' due in 7 days)</summary><div class="bar"><div style="width:' + pct + '%"></div></div><ul>';
    if (!up.length) html += '<li class="done">Nothing due in the next 7 days.</li>';
    up.forEach(function(x){
      var cls = x.status === 'done' ? 'done' : (x.status === 'pending' ? 'todo' : 'blocked');
      html += '<li class="' + cls + '">' + esc(x.key) + ' — ' + esc(x.status) + ' (due ' + esc(x.date) + ')</li>';
    });
    html += '</ul></details>';
  });
  document.getElementById('app').innerHTML = html;
  var need = '', inperson = '';
  classes.forEach(function(c){
    c.rows.forEach(function(x){
      var isBlocked = x.status && x.status.indexOf('blocked') === 0;
      if (!isBlocked) return;
      var d = parseD(x.date);
      var note = esc((x.note||'').replace(/^#\s*/,''));
      if (x.status === 'blocked_inperson') {
        if (/\b0\s?pts?\b/i.test(x.note || '')) return;
        if (d && d >= now && d <= in7) inperson += '<li><b>' + c.name + ' — ' + esc(x.key) + '</b>' + (x.date ? ' (due ' + esc(x.date) + ')' : '') + '<br><span class="small">' + note + '</span></li>';
        return;
      }
      if (d && d < now) return;
      need += '<li><b>' + c.name + ' — ' + esc(x.key) + '</b> (' + esc(x.status) + (x.date ? ', due ' + esc(x.date) : '') + ')<br><span class="small">' + note + '</span><br><a href="https://github.com/zackhada/school-dashboard/issues/new?title=' + encodeURIComponent('[answer] ' + c.repo + ' ' + x.key) + '&body=' + encodeURIComponent('Question: ' + (x.note||x.key) + '\n\nMy answer:\n') + '">Reply to runner</a></li>';
    });
  });
  document.getElementById('needs').innerHTML = need ? '<h2>Needs your input</h2><p class="small">Automatable tasks stuck on your input. Reply and the runner continues.</p><ul>' + need + '</ul>' : '<h2>Needs your input</h2><p class="small">Nothing waiting on you.</p>';
  document.getElementById('needs').innerHTML += inperson ? '<h2>In person + proctored (7 days)</h2><p class="small">Credit you earn by showing up.</p><ul>' + inperson + '</ul>' : '';
  document.getElementById('ts').textContent = 'Updated ' + new Date().toUTCString();
});
</script>
</body></html>
