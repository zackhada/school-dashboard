name: Nightly Canvas scrape
on:
  schedule:
    # QUIET HOURS (Zack 2026-11-10): no self-hosted work 10pm-10am MT.
    # 17:50 UTC = 10:50am MST / 11:50am MDT.
    - cron: '50 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # QUIET HOURS (Zack 2026-11-10): the runner Mac must be silent 10pm-10am MT,
      # so no scrape/build (Chrome + Python) starts in that window.
      - name: Quiet hours gate (10pm-10am MT)
        run: |
          if python3 scripts/quiet_hours.py >/dev/null 2>&1; then
            echo "QUIET=false" >> "$GITHUB_ENV"
          else
            echo "::notice::Quiet hours (10pm-10am MT); dashboard scrape skips."
            echo "QUIET=true" >> "$GITHUB_ENV"
          fi
      - name: Sync ledgers from class repos
        if: env.QUIET != 'true'
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python3 scripts/sync_ledgers.py
      - name: Scrape Canvas
        if: env.QUIET != 'true'
        continue-on-error: true
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          if [ -z "$CANVAS_TOKEN" ]; then echo "No CANVAS_TOKEN; skipping."; exit 0; fi
          python3 scripts/scrape.py
          python3 scripts/build.py
      - name: Host + runner health
        if: env.QUIET != 'true'
        continue-on-error: true
        env:
          # Must be the PAT: reading other repos' runners with the job token
          # returns 404 and health.py then reports 0 of 9 online, which puts the
          # "spare Mac silent" banner on a perfectly healthy fleet (2026-11-11).
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python3 scripts/health.py
      - name: Assignment audit
        if: env.QUIET != 'true'
        continue-on-error: true
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          # Built 2026-10-25 after the STRAT 392 midterm (150 pts, Testing
          # Center) was never sat because no Canvas row existed for it.
          # Zack does not want calendar reminders (2026-10-27), so this writes
          # data/audit.json only. Do not pass --sync-alerts.
          python3 scripts/assignment_audit.py
      - name: Commit truth
        if: env.QUIET != 'true'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          # Commit ONLY generated data. `git add -A` pushed this bot's
          # whole checkout back to main, so any edit made to a workflow or
          # script after the bot checked out was silently reverted by the
          # next "nightly canvas truth" commit (2026-11-11: it reverted
          # the very fix to this file twice).
          git add data
          git diff --cached --quiet || git commit -m "nightly canvas truth $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" && git push origin HEAD