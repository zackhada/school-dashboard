name: Nightly Canvas scrape
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Scrape Canvas
        continue-on-error: true
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        run: |
          if [ -z "$CANVAS_TOKEN" ]; then echo "No CANVAS_TOKEN; skipping."; exit 0; fi
          python3 scripts/scrape.py
          python3 scripts/build.py
      - name: Commit truth
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "nightly canvas truth $(date -u +%Y-%m-%d)"
          git push origin HEAD
