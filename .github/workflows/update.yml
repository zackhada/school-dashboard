name: Dashboard update
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [status]
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Save status payload
        run: |
          REPO='${{ github.event.client_payload.repo }}'
          if [ -n "$REPO" ]; then
            SHORT=$(basename "$REPO")
            mkdir -p data
            echo '${{ toJson(github.event.client_payload) }}' > "data/${SHORT}.json"
          fi
          ls data/ 2>/dev/null || true
      - name: Sync ledgers from class repos
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python3 scripts/sync_ledgers.py
      - name: Rebuild canonical combined files
        run: python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "dashboard update $(date -u +%Y-%m-%d)"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" && git push origin HEAD
  forward-answer:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[answer]')
    runs-on: self-hosted
    steps:
      - name: Forward answer to class repo and close
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "No DISPATCH_TOKEN; skipping."; exit 0; fi
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok = os.environ["DISPATCH_TOKEN"]
          title = os.environ.get("ISSUE_TITLE", "")
          num = os.environ.get("ISSUE_NUMBER", "")
          rest = title[len("[answer]"):].strip() if title.startswith("[answer]") else title
          parts = rest.split(None, 2)
          repo, key = (parts + ["", ""])[:2]
          if not repo or not key:
              raise SystemExit("cannot parse repo/key from title: %r" % title)
          api = lambda p: urllib.request.Request(
              "https://api.github.com/repos/zackhada/%s" % p,
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json"})
          issue = json.load(urllib.request.urlopen(api("school-dashboard/issues/%s" % num)))
          body = issue.get("body") or ""
          answer = body.split("My answer:")[-1].strip() if "My answer:" in body else body.strip()
          if not answer and len(parts) == 3:
              answer = parts[2].strip()  # Zack typed the reply into the title
          if not answer:
              raise SystemExit("empty answer; leaving issue open")
          payload = {"event_type": "answer",
                     "client_payload": {"key": key, "answer": answer}}
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/zackhada/%s/dispatches" % repo,
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json"}))
          print("forwarded answer for %s to %s" % (key, repo))
          close = json.dumps({"state": "closed"}).encode()
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/zackhada/school-dashboard/issues/%s" % num,
              data=close, method="PATCH",
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"}))
          comment = json.dumps({"body": "Forwarded to the class runner."}).encode()
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/zackhada/school-dashboard/issues/%s/comments" % num,
              data=comment,
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"}))
          print("closed issue %s" % num)
          PYEOF
