name: Dashboard update
on:
  issues:
    types: [opened]
  repository_dispatch:
    types: [status]
  schedule:
    # QUIET HOURS (Zack 2026-11-10): 18:20 UTC = 11:20am MST / 12:20pm MDT.
    - cron: '20 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
# ONE WRITER AT A TIME (2026-11-12). Every class runner dispatches a "status"
# event when it finishes, so several of these runs used to start within the same
# few seconds. They shared no group, so all but the first died on
# "! [rejected] HEAD -> main (fetch first)" and GitHub emailed Zack a
# "Run failed: Dashboard update" for each one (18 of 20 dashboard failures on
# 2026-11-11/12). Queuing here, plus the retry in scripts/push_data.sh, is what
# makes that failure mode impossible rather than just less likely.
# cancel-in-progress stays false: the running build always finishes. A pending
# duplicate may be replaced by a newer dispatch, which is harmless because
# sync_ledgers.py rebuilds data/ from all seven class repos every run.
concurrency:
  group: dashboard-data-push
  cancel-in-progress: false
jobs:
  update:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # QUIET HOURS (Zack 2026-11-10): the scheduled rebuild must not touch the
      # Mac between 10pm and 10am. Issue/payload-triggered builds still run; they
      # are seconds of work, not a Chrome/LLM job.
      - name: Quiet hours gate (scheduled runs only)
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "QUIET=false" >> "$GITHUB_ENV"; exit 0
          fi
          if python3 scripts/quiet_hours.py >/dev/null 2>&1; then
            echo "QUIET=false" >> "$GITHUB_ENV"
          else
            echo "::notice::Quiet hours (10pm-10am MT); scheduled rebuild skips."
            echo "QUIET=true" >> "$GITHUB_ENV"
          fi
      - name: Save status payload
        if: env.QUIET != 'true'
        # The payload MUST arrive via env, never inlined into the shell. Until
        # 2026-11-02 it was `echo '${{ toJson(...) }}'`, so any ledger note
        # containing an apostrophe ("Zack's") broke the quoting and failed the
        # step. Every class runner dispatches one of these per run, which turned
        # into ~47 failed runs and "Run failed: Dashboard update" emails a day.
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          REPO: ${{ github.event.client_payload.repo }}
        run: |
          if [ -n "${REPO:-}" ]; then
            SHORT=$(basename "$REPO")
            mkdir -p data
            printf '%s\n' "$PAYLOAD" > "data/${SHORT}.json"
          fi
          ls data/ 2>/dev/null || true
      - name: Sync ledgers from class repos
        if: env.QUIET != 'true'
        continue-on-error: true
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: python3 scripts/sync_ledgers.py
      - name: Rebuild canonical combined files
        if: env.QUIET != 'true'
        run: python3 scripts/build.py
      - name: Commit
        if: env.QUIET != 'true'
        env:
          # push_data.sh commits ONLY data/ and retries with a rebase, so a
          # concurrent dashboard writer is a retry, not a failed run.
          PUSH_TOKEN: ${{ github.token }}
        run: bash scripts/push_data.sh "dashboard update $(date -u +%Y-%m-%d)"
  forward-answer:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[answer]')
    runs-on: self-hosted
    steps:
      - name: Forward answer to class repo and close
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then echo "No DISPATCH_TOKEN; skipping."; exit 0; fi
          python3 - <<'PYEOF'
          import json, os, urllib.request
          tok = os.environ["DISPATCH_TOKEN"]
          title = os.environ.get("ISSUE_TITLE", "")
          num = os.environ.get("ISSUE_NUMBER", "")
          rest = title[len("[answer]"):].strip() if title.startswith("[answer]") else title
          parts = rest.split(None, 2)
          repo, key = (parts + ["", ""])[:2]
          if not repo or not key:
              raise SystemExit("cannot parse repo/key from title: %r" % title)
          api = lambda p: urllib.request.Request(
              "https://api.github.com/repos/zackhada/%s" % p,
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json"})
          issue = json.load(urllib.request.urlopen(api("school-dashboard/issues/%s" % num)))
          body = issue.get("body") or ""
          answer = body.split("My answer:")[-1].strip() if "My answer:" in body else body.strip()
          if not answer and len(parts) == 3:
              answer = parts[2].strip()  # Zack typed the reply into the title
          if not answer:
              raise SystemExit("empty answer; leaving issue open")
          payload = {"event_type": "answer",
                     "client_payload": {"key": key, "answer": answer}}
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/zackhada/%s/dispatches" % repo,
              data=json.dumps(payload).encode(),
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json"}))
          print("forwarded answer for %s to %s" % (key, repo))
          close = json.dumps({"state": "closed"}).encode()
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/zackhada/school-dashboard/issues/%s" % num,
              data=close, method="PATCH",
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"}))
          comment = json.dumps({"body": "Forwarded to the class runner."}).encode()
          urllib.request.urlopen(urllib.request.Request(
              "https://api.github.com/repos/zackhada/school-dashboard/issues/%s/comments" % num,
              data=comment,
              headers={"Authorization": "Bearer " + tok,
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"}))
          print("closed issue %s" % num)
          PYEOF
