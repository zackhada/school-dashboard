<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grades - Fall 2026 Dashboard</title>
<style>body{font-family:-apple-system,Helvetica,Arial,sans-serif;max-width:900px;margin:0 auto;padding:16px;color:#222}
h1{font-size:20px}.small{font-size:12px;color:#666}
details{border:1px solid #ddd;border-radius:8px;margin:10px 0;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;table-layout:fixed}
th{text-align:left;font-size:12px;color:#666;border-bottom:2px solid #ddd;padding:6px 8px}
td{border-bottom:1px solid #eee;padding:6px 8px;vertical-align:top;overflow:hidden;text-overflow:ellipsis}
col.g-name{width:34%}col.g-due{width:11%}col.g-status{width:12%}col.g-grade{width:13%}
tr.missing td.name{color:#b3261e}tr.graded td.grade{color:#1a7f37;font-weight:600}
nav{font-size:14px;margin-bottom:8px}.cm{font-size:12px;color:#333}</style>
</head><body>
<nav><a href="index.html">&larr; Back to dashboard</a></nav>
<h1>Grades - Fall 2026</h1>
<p class="small" id="ts">Loading...</p>
<div id="app"></div>
<script>
var REPOS = [
  ["HRM 391","hrm391-automation"],
  ["STRAT 392","strat392-automation"],
  ["REL C 333","rel-c-333-automation"],
  ["PSE 390","pse390-automation"],
  ["FIN 201","fin201-automation"],
  ["IS 515","is515-automation"],
  ["ECON 110","econ110-automation"]
];
function esc(s){ return String(s==null?'':s).replace(/</g,'&lt;'); }
Promise.all(REPOS.map(function(pair){
  return fetch('data/' + pair[1] + '.grades.json').then(function(r){ return r.ok ? r.json() : {rows:[]}; }).catch(function(){ return {rows:[]}; }).then(function(d){ return {name: pair[0], rows: d.rows || []}; });
})).then(function(classes){
  var html = '';
  classes.forEach(function(c, i){
    var rows = c.rows.slice().sort(function(a,b){
      if (!a.due && !b.due) return 0;
      if (!a.due) return 1;
      if (!b.due) return -1;
      return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0);
    });
    var graded = rows.filter(function(x){ return x.score != null; });
    var now = new Date();
    var past = rows.filter(function(x){ return x.score != null || (x.due && new Date(x.due) < now); });
    var tot = past.reduce(function(s,x){ return s + (+x.score||0); }, 0);
    var pts = past.reduce(function(s,x){ return s + (+x.points||0); }, 0);
    var pct = pts ? ', ' + Math.round(100*tot/pts) + '%' : '';
    html += '<details' + (i < 2 ? ' open' : '') + '><summary>' + esc(c.name) + ' (' + graded.length + '/' + rows.length + ' graded' + pct + ')</summary>';
    if (!rows.length) { html += '<p class="small">No grade data yet.</p></details>'; return; }
    html += '<table><colgroup><col class="g-name"><col class="g-due"><col class="g-status"><col class="g-grade"><col></colgroup><tr><th>Name</th><th>Due</th><th>Status</th><th>Grade</th><th>Comments</th></tr>';
    rows.forEach(function(x){
      var due = x.due ? String(x.due).slice(0,10) : '—';
      var isMissing = x.missing || (x.status === 'unsubmitted' && x.due && new Date(x.due) < new Date());
      var grade = (x.score != null) ? esc(x.score) + ' / ' + esc(x.points) : (isMissing ? '0 / ' + esc(x.points) : '—');
      var cls = (x.score != null) ? 'graded' : '';
      var st;
      if (isMissing) { st = 'missing'; cls = 'missing'; }
      else if (x.submitted_at || x.status === 'submitted' || x.status === 'graded') st = 'submitted';
      else st = 'unsubmitted';
      var cm = (x.comments && x.comments.length)
        ? x.comments.map(function(m){ return '<div class="cm">' + esc(m.comment||'') + ' <span class="small">— ' + esc(m.author||'grader') + '</span></div>'; }).join('')
        : '<span class="small">—</span>';
      html += '<tr class="' + cls + '"><td class="name">' + esc(x.name||'(untitled)') + '</td><td>' + esc(due) + '</td><td>' + st + '</td><td class="grade">' + grade + '</td><td>' + cm + '</td></tr>';
    });
    html += '</table></details>';
  });
  document.getElementById('app').innerHTML = html;
  document.getElementById('ts').textContent = 'Updated ' + new Date().toUTCString();
});
</script>
</body></html>
